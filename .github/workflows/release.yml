name: Build and Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies (Engine)
        working-directory: fluxmetric_engine
        run: flutter pub get

      - name: Install Dependencies (App)
        working-directory: fluxmetric_app
        run: flutter pub get

      - name: Build Windows
        working-directory: fluxmetric_app
        run: flutter build windows --release

      - name: Package Build
        shell: pwsh
        run: |
          $releaseDir = "fluxmetric_app/build/windows/x64/runner/Release"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "fluxmetric-windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: fluxmetric-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (Manual Build)
        if: (!startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: fluxmetric-windows-x64
          path: fluxmetric-windows-x64.zip
